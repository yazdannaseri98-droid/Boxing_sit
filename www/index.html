<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>آموزش بوکس حرفه‌ای</title>
  <!-- نسخه‌ی وب نصب‌شدنی (PWA) برای آیفون و هر مرورگر دیگه -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0B0B0D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Naseri Boxing" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script src="vendor-tailwind.js"></script>
  <script src="vendor-react.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B0B0D; overscroll-behavior: none; }
    #root { min-height: 100%; }

    /* جلوگیری از انتخاب متن/عکس با لمس طولانی، مثل یه اپ واقعی نه یه صفحه‌ی وب */
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none; /* منوی کپی/ذخیره‌ی لمس طولانی رو هم غیرفعال می‌کنه */
      -webkit-tap-highlight-color: transparent; /* حذف فلاش خاکستری موقع لمس */
    }
    img {
      -webkit-user-drag: none;
      user-drag: none;
    }
    /* داخل فیلدهای ورودی، انتخاب و تایپ متن باید عادی کار کنه */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
  <script>
    // فقط روی وب (نه داخل اپ اندروید/iOS که با Capacitor ساخته شده)
    if ("serviceWorker" in navigator && /^https?:/.test(location.protocol) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
