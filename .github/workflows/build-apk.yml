name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first time only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0B0B0D' --iconBackgroundColorDark '#0B0B0D'

      - name: Install custom notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/notification-icon.png android/app/src/main/res/drawable/ic_stat_glove.png

      - name: Sync web assets into Android project
        run: npx cap sync
