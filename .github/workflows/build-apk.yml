name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first time only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0B0B0D' --iconBackgroundColorDark '#0B0B0D'

      - name: Install custom notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/notification-icon.png android/app/src/main/res/drawable/ic_stat_glove.png

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Restore release signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Patch build.gradle for consistent signing + versioning
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: 1.0.${{ github.run_number }}
        run: node scripts/configure-signing.js

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build signed release APK
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxing-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
